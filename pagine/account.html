<!DOCTYPE html>
<html lang="it">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<title>Il mio account - Cinema che Gasa</title>

		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="../css/style.css">
		<link rel="stylesheet" href="../css/account.css">
	</head>

	<body>

		<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
			<div class="container-fluid px-4">
				<a class="navbar-brand fw-bold" href="../index.html">
					Cinema che Gasa
				</a>

				<a href="../index.html" class="btn btn-outline-light">
					<i class="bi bi-house"></i>
					Home
				</a>
			</div>
		</nav>

		<main class="auth-page">

			<div class="auth-card">

				<span class="section-label">CINEMA CHE GASA</span>

				<h1>
					<i class="bi bi-person-circle"></i>
					Il mio account
				</h1>

				<p id="accountEmail">
					Caricamento...
				</p>

				<div class="d-grid gap-2 mt-4">

					<button class="btn btn-outline-light" id="changePasswordButton">
						<i class="bi bi-key"></i>
						Cambia password
					</button>

					<button class="btn btn-outline-light" id="cookieButton">
						<i class="bi bi-cookie"></i>
						Preferenze cookie
					</button>

					<a href="../termini.html" class="btn btn-outline-light">
						<i class="bi bi-file-text"></i>
						Termini e condizioni
					</a>

					<a href="../privacy.html" class="btn btn-outline-light">
						<i class="bi bi-shield-check"></i>
						Privacy Policy
					</a>

					<button class="btn btn-outline-danger mt-3" id="deleteAccountButton">
						<i class="bi bi-trash3"></i>
						Elimina account
					</button>

				</div>

				<div id="accountMessage" class="auth-message"></div>

			</div>

		</main>

		<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../js/supabase.js"></script>
        <script src="../js/cookie-consent.js"></script>
        <script src="../js/account.js"></script>

	</body>
</html>
