<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Film - Cinema che Gasa</title>
    <link rel="icon" type="image/png" href="img/logo_cinema-che-gasa.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">

        <div class="container-fluid px-4">

            <a class="navbar-brand fw-bold" href="../index.html">
                Cinema che Gasa
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Apri menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">

                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">
                            <i class="bi bi-house-door"></i> Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="film.html">
                            <i class="bi bi-film"></i> Film
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="generi.html">
                            <i class="bi bi-grid"></i> Generi
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="classifiche.html">
                            <i class="bi bi-trophy"></i> Classifiche
                        </a>
                    </li>

                </ul>

                <div class="d-flex gap-2" id="accountArea">

                    <a href="login.html" class="btn btn-outline-light">
                        <i class="bi bi-box-arrow-in-right"></i> Accedi
                    </a>

                    <a href="registrazione.html" class="btn btn-light">
                        Registrati
                    </a>

                </div>

            </div>

        </div>

    </nav>


    <main class="films-page">

        <div class="container">

            <div class="films-header">

                <span class="section-label">
                    LA TUA COLLEZIONE
                </span>

                <h1>
                    Tutti i film
                </h1>

                <p>
                    Esplora tutti i film presenti in Cinema che Gasa.
                </p>

            </div>


            <div class="search-box">

                <i class="bi bi-search"></i>

                <input
                    type="text"
                    id="filmSearch"
                    placeholder="Cerca un film..."
                    autocomplete="off">

            </div>


            <div class="film-filters">

                <select id="genreFilter">

                    <option value="">
                        Tutti i generi
                    </option>

                </select>


                <select id="yearFilter">

                    <option value="">
                        Tutti gli anni
                    </option>

                </select>


                <select id="ratingFilter">

                    <option value="">
                        Qualsiasi voto
                    </option>

                    <option value="6">
                        6+
                    </option>

                    <option value="7">
                        7+
                    </option>

                    <option value="8">
                        8+
                    </option>

                    <option value="9">
                        9+
                    </option>

                    <option value="10">
                        10
                    </option>

                </select>

            </div>


            <div class="row g-4" id="filmsContainer"></div>

        </div>

    </main>


    <footer>

        <div class="container text-center">

            <p>
                © <span id="currentYear"></span> Cinema che Gasa - sito in fase di sviluppo
            </p>

        </div>

    </footer>


    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>

    <!-- JavaScript del sito -->
    <script src="../js/app.js"></script>
    <script src="../js/film.js"></script>

</body>

</html>
