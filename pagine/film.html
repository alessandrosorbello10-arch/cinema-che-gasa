    <style>
        /* Area della paginazione */

        .films-pagination {
            margin: 45px 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
        }

        .pagination-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #b8b8b8;
            font-size: 0.92rem;
        }

        .pagination-info strong {
            color: #fff;
            font-weight: 700;
        }

        .pagination-info-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            border-radius: 10px;
            background: rgba(220, 0, 0, 0.12);
            color: #ff3030;
        }

        /* Controlli di navigazione */

        .pagination-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            max-width: 100%;
        }

        .pagination-numbers {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .pagination-number,
        .pagination-arrow {
            min-width: 42px;
            height: 42px;
            padding: 0 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid #303030;
            border-radius: 12px;
            background: #151515;
            color: #eee;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .pagination-number:hover:not(.active),
        .pagination-arrow:hover:not(:disabled) {
            background: #252525;
            border-color: #e50914;
            color: #fff;
            transform: translateY(-2px);
        }

        .pagination-number.active {
            background: #e50914;
            border-color: #e50914;
            color: #fff;
            box-shadow: 0 4px 16px rgba(229, 9, 20, 0.25);
        }

        .pagination-arrow:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }

        .pagination-ellipsis {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 18px;
            color: #888;
        }

        .pagination-number:focus-visible,
        .pagination-arrow:focus-visible {
            outline: 2px solid #ff3030;
            outline-offset: 3px;
        }

        .films-pagination:empty {
            display: none;
        }

        /* Adattamento agli smartphone */

        @media (max-width: 575.98px) {
            .films-pagination {
                margin-top: 32px;
                gap: 18px;
            }

            .pagination-controls {
                width: 100%;
                gap: 5px;
            }

            .pagination-numbers {
                gap: 4px;
            }

            .pagination-number {
                min-width: 34px;
                height: 38px;
                padding: 0 7px;
                border-radius: 9px;
                font-size: 0.82rem;
            }

            .pagination-arrow {
                min-width: 38px;
                height: 38px;
                padding: 0 8px;
                border-radius: 9px;
            }

            .pagination-arrow span {
                display: none;
            }

            .pagination-info {
                font-size: 0.84rem;
            }
        }

        /* Rispetta le preferenze di accessibilità */

        @media (prefers-reduced-motion: reduce) {
            .pagination-number,
            .pagination-arrow {
                transition: none;
            }
        }
    </style>
    ```
