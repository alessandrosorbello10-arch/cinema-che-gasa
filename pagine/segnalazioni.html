<!DOCTYPE html>
<html lang="it">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Segnalazioni - Cinema che Gasa</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">

        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/segnalazioni.css">
    </head>

    <body>

        <!-- NAVBAR -->

        <nav class="navbar navbar-dark bg-dark">
            <div class="container-fluid">

                <a
                    href="admin.html"
                    class="navbar-brand fw-bold"
                >
                    <i class="bi bi-shield-lock"></i>
                    Cinema che Gasa
                </a>

                <a
                    href="admin.html"
                    class="btn btn-outline-light"
                >
                    <i class="bi bi-arrow-left"></i>
                    Torna all'admin
                </a>

            </div>
        </nav>


        <!-- CONTENUTO -->

        <main class="container py-5">

            <div class="admin-header mb-4">

                <h1>
                    <i class="bi bi-exclamation-triangle"></i>
                    Segnalazioni
                </h1>

                <p class="text-secondary mb-0">
                    Controlla e correggi i problemi presenti nei film.
                </p>

            </div>


            <!-- STATISTICHE -->

            <div class="row g-3 mb-4">

                <div class="col-md-4">

                    <div class="admin-card h-100">

                        <div class="d-flex align-items-center gap-3">

                            <i class="bi bi-exclamation-circle fs-1 text-danger"></i>

                            <div>
                                <div class="text-secondary">
                                    Segnalazioni aperte
                                </div>

                                <div
                                    id="totalReports"
                                    class="fs-2 fw-bold"
                                >
                                    0
                                </div>
                            </div>

                        </div>

                    </div>

                </div>


                <div class="col-md-4">

                    <div class="admin-card h-100">

                        <div class="d-flex align-items-center gap-3">

                            <i class="bi bi-film fs-1 text-warning"></i>

                            <div>
                                <div class="text-secondary">
                                    Film con problemi
                                </div>

                                <div
                                    id="problemFilms"
                                    class="fs-2 fw-bold"
                                >
                                    0
                                </div>
                            </div>

                        </div>

                    </div>

                </div>


                <div class="col-md-4">

                    <div class="admin-card h-100">

                        <div class="d-flex align-items-center gap-3">

                            <i class="bi bi-check-circle fs-1 text-success"></i>

                            <div>
                                <div class="text-secondary">
                                    Segnalazioni risolte
                                </div>

                                <div
                                    id="resolvedReports"
                                    class="fs-2 fw-bold"
                                >
                                    0
                                </div>
                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- STRUMENTI -->

            <div class="admin-card mb-4">

                <div class="d-flex flex-column flex-md-row gap-3">

                    <div class="flex-grow-1">

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-search"></i>
                            </span>

                            <input
                                type="text"
                                id="reportSearch"
                                class="form-control"
                                placeholder="Cerca un film..."
                            >

                        </div>

                    </div>


                    <div>

                        <button
                            id="showProblemsButton"
                            class="btn btn-outline-danger"
                            type="button"
                        >
                            <i class="bi bi-exclamation-triangle"></i>
                            Mostra tutti i film
                        </button>

                    </div>

                </div>

            </div>


            <!-- TABELLA -->

            <div class="admin-card">

                <div class="table-responsive">

                    <table class="table table-dark table-hover align-middle mb-0">

                        <thead>

                            <tr>
                                <th>Titolo</th>
                                <th>Anno</th>
                                <th>Copertina</th>
                                <th>Problema</th>
                                <th>Stato</th>
                                <th>Azioni</th>
                            </tr>

                        </thead>

                        <tbody id="reportsTable">

                            <tr>
                                <td
                                    colspan="6"
                                    class="text-center py-4"
                                >
                                    Caricamento...
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </main>


        <!-- MODAL MODIFICA FILM -->

        <div
            class="modal fade"
            id="editFilmModal"
            tabindex="-1"
            aria-hidden="true"
        >

            <div class="modal-dialog modal-lg modal-dialog-scrollable">

                <div class="modal-content bg-dark text-white">

                    <div class="modal-header">

                        <h5 class="modal-title">
                            <i class="bi bi-pencil"></i>
                            Modifica film
                        </h5>

                        <button
                            type="button"
                            class="btn-close btn-close-white"
                            data-bs-dismiss="modal"
                            aria-label="Chiudi"
                        ></button>

                    </div>


                    <div class="modal-body">

                        <input
                            type="hidden"
                            id="editFilmId"
                        >

                        <input
                            type="hidden"
                            id="editReportId"
                        >


                        <!-- TITOLO -->

                        <div class="mb-3">

                            <label
                                for="editTitolo"
                                class="form-label"
                            >
                                Titolo
                            </label>

                            <input
                                type="text"
                                id="editTitolo"
                                class="form-control"
                            >

                        </div>


                        <!-- ANNO -->

                        <div class="mb-3">

                            <label
                                for="editAnno"
                                class="form-label"
                            >
                                Anno
                            </label>

                            <input
                                type="number"
                                id="editAnno"
                                class="form-control"
                            >

                        </div>


                        <!-- GENERE -->

                        <div class="mb-3">

                            <label
                                for="editGenere"
                                class="form-label"
                            >
                                Genere
                            </label>

                            <input
                                type="text"
                                id="editGenere"
                                class="form-control"
                            >

                        </div>


                        <!-- VOTO -->

                        <div class="mb-3">

                            <label
                                for="editVoto"
                                class="form-label"
                            >
                                Voto
                            </label>

                            <input
                                type="number"
                                id="editVoto"
                                class="form-control"
                                step="0.1"
                                min="0"
                                max="10"
                            >

                        </div>


                        <!-- DURATA -->

                        <div class="mb-3">

                            <label
                                for="editDurata"
                                class="form-label"
                            >
                                Durata
                            </label>

                            <input
                                type="text"
                                id="editDurata"
                                class="form-control"
                            >

                        </div>


                        <!-- REGISTA -->

                        <div class="mb-3">

                            <label
                                for="editRegista"
                                class="form-label"
                            >
                                Regista
                            </label>

                            <input
                                type="text"
                                id="editRegista"
                                class="form-control"
                            >

                        </div>


                        <!-- COPERTINA -->

                        <div class="mb-3">

                            <label
                                for="editImmagine"
                                class="form-label"
                            >
                                URL copertina
                            </label>

                            <input
                                type="url"
                                id="editImmagine"
                                class="form-control"
                            >

                        </div>


                        <!-- DESCRIZIONE -->

                        <div class="mb-3">

                            <label
                                for="editDescrizione"
                                class="form-label"
                            >
                                Descrizione
                            </label>

                            <textarea
                                id="editDescrizione"
                                class="form-control"
                                rows="5"
                            ></textarea>

                        </div>


                        <div id="editFilmMessage"></div>

                    </div>


                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                        >
                            Annulla
                        </button>

                        <button
                            type="button"
                            id="saveFilmButton"
                            class="btn btn-danger"
                        >
                            <i class="bi bi-save"></i>
                            Salva modifiche
                        </button>

                    </div>

                </div>

            </div>

        </div>


        <!-- SCRIPT -->

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        <script src="../js/cookie-consent.js"></script>

        <script src="../js/supabase.js"></script>

        <script src="../js/segnalazioni.js"></script>

    </body>

</html>
