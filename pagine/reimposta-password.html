<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Reimposta password - Cinema che Gasa</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="../css/style.css">
        <link rel="icon" type="image/png" href="../img/logo_cinema-che-gasa.png">

        <style>
            .password-wrapper {
                position: relative;
            }

            .password-wrapper .form-control {
                padding-right: 45px;
            }

            .password-toggle {
                position: absolute;
                top: 50%;
                right: 12px;
                transform: translateY(-50%);
                border: none;
                background: transparent;
                color: #777;
                cursor: pointer;
            }

            .password-toggle:hover {
                color: #dc3545;
            }

            .auth-message:empty {
                display: none;
            }

            .auth-message {
                overflow-wrap: anywhere;
            }
        </style>
    </head>

    <body>
        <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
            <div class="container-fluid px-4">
                <a class="navbar-brand d-flex align-items-center" href="../index.html">
                    <img
                        src="../img/logo_cinema-che-gasa.png"
                        alt="Cinema che Gasa"
                        class="site-logo"
                    >

                    <strong>
                        <span style="color: red; font-size: larger;">Cinema</span>
                        che Gasa
                    </strong>
                </a>
            </div>
        </nav>

        <main class="auth-page">
            <div class="auth-card">
                <span class="section-label">CINEMA CHE GASA</span>

                <h1>Nuova password</h1>

                <p>
                    Inserisci e conferma la nuova password per recuperare
                    l'accesso al tuo account.
                </p>

                <form id="resetPasswordForm">
                    <div class="mb-3">
                        <label for="newPassword" class="form-label">
                            Nuova password
                        </label>

                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="newPassword"
                                class="form-control"
                                autocomplete="new-password"
                                minlength="6"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="toggleNewPassword"
                                aria-label="Mostra password"
                            >
                                <i class="bi bi-eye" id="newPasswordIcon"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">
                            Conferma password
                        </label>

                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="confirmPassword"
                                class="form-control"
                                autocomplete="new-password"
                                minlength="6"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="toggleConfirmPassword"
                                aria-label="Mostra password"
                            >
                                <i class="bi bi-eye" id="confirmPasswordIcon"></i>
                            </button>
                        </div>
                    </div>

                    <button
                        type="submit"
                        id="resetPasswordButton"
                        class="btn btn-light w-100"
                        disabled
                    >
                        <i class="bi bi-shield-lock"></i>
                        Salva nuova password
                    </button>

                    <div
                        id="resetPasswordMessage"
                        class="auth-message mt-3"
                        role="status"
                        aria-live="polite"
                    ></div>
                </form>

                <p class="auth-switch">
                    <a href="login.html">Torna al login</a>
                </p>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../js/supabase.js"></script>
        <script src="../js/reimposta-password.js"></script>
        <script src="../js/cookie-consent.js"></script>
    </body>
</html>
