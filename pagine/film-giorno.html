<!DOCTYPE html>
<html lang="it">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Film del giorno - Cinema che Gasa</title>

        <meta
            name="description"
            content="Scopri il film del giorno scelto automaticamente da Cinema che Gasa."
        >

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        >

        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        >

        <link
            rel="icon"
            type="image/png"
            href="../img/logo_cinema-che-gasa.png"
        >

        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/film-giorno.css">

    </head>

    <body>

        <nav class="navbar navbar-expand-lg navbar-dark fixed-top">

            <div class="container-fluid px-4">

                <a class="navbar-brand d-flex align-items-center" href="../index.html">

                    <img
                        src="../img/logo_cinema-che-gasa.png"
                        alt="Cinema che Gasa"
                        class="site-logo"
                    >

                    <span>
                        <strong>
                            <span style="color: red; font-size: larger;">Cinema</span>
                            che Gasa
                        </strong>
                    </span>

                </a>

                <a href="film.html" class="btn btn-outline-light">
                    <i class="bi bi-house"></i> Torna indietro
                </a>

            </div>

        </nav>


        <main class="container film-giorno-container">

            <h1>FILM DEL GIORNO</h1>

            <p class="film-giorno-sottotitolo">
                Ogni giorno una nuova pellicola da scoprire.
            </p>

            <div id="filmGiorno">

                <div class="film-giorno-loading">
                    <div class="spinner-border text-danger"></div>
                    <p>Caricamento del film...</p>
                </div>

            </div>

        </main>


        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../js/supabase.js"></script>
        <script src="../js/film-giorno.js"></script>

    </body>

</html>
