<!DOCTYPE html>

<html lang="it">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Pannello Admin - Cinema che Gasa</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

        <link rel="stylesheet" href="../css/style.css">

    </head>

    <body>

        <nav class="navbar navbar-dark fixed-top">

            <div class="container-fluid px-4">

                <a class="navbar-brand fw-bold" href="../index.html">
                    Cinema che Gasa
                </a>

                <a href="../index.html" class="btn btn-outline-light">
                    <i class="bi bi-arrow-left"></i> Torna al sito
                </a>

            </div>

        </nav>


        <main class="admin-page">

            <div class="container">

                <div class="admin-header">

                    <span class="section-label">
                        CINEMA CHE GASA
                    </span>

                    <h1>
                        Pannello Admin
                    </h1>

                    <p>
                        Gestisci il catalogo e le funzionalità del sito.
                    </p>

                </div>


                <div class="row g-4 mb-5">

                    <div class="col-md-4">

                        <div class="admin-stat">

                            <i class="bi bi-film"></i>

                            <div>

                                <span>
                                    Film
                                </span>

                                <strong id="totalFilms">
                                    0
                                </strong>

                            </div>

                        </div>

                    </div>


                    <div class="col-md-4">

                        <div class="admin-stat">

                            <i class="bi bi-people"></i>

                            <div>

                                <span>
                                    Utenti
                                </span>

                                <strong id="totalUsers">
                                    0
                                </strong>

                            </div>

                        </div>

                    </div>


                    <div class="col-md-4">

                        <div class="admin-stat">

                            <i class="bi bi-star-fill"></i>

                            <div>

                                <span>
                                    Voto medio
                                </span>

                                <strong id="averageRating">
                                    0.0
                                </strong>

                            </div>

                        </div>

                    </div>

                </div>


                <div class="admin-card">

                    <div class="admin-card-header">

                        <div>

                            <span class="section-label">
                                GESTIONE
                            </span>

                            <h2>
                                Film
                            </h2>

                        </div>


                        <button
                            class="btn btn-light"
                            id="addFilmButton"
                            type="button"
                        >

                            <i class="bi bi-plus-lg"></i>
                            Aggiungi film

                        </button>

                    </div>


                    <div
                        id="filmFormContainer"
                        class="admin-form-container"
                        style="display: none;"
                    >

                        <div class="admin-form-header">

                            <div>

                                <span class="section-label">
                                    NUOVO FILM
                                </span>

                                <h2>
                                    Aggiungi un film
                                </h2>

                            </div>

                        </div>


                        <form id="addFilmForm">

                            <div class="row g-4">


                                <div class="col-md-8">

                                    <label
                                        for="filmTitle"
                                        class="form-label"
                                    >
                                        Titolo
                                    </label>

                                    <input
                                        type="text"
                                        id="filmTitle"
                                        class="form-control"
                                        placeholder="Es. Il sesto senso"
                                        required
                                    >

                                </div>


                                <div class="col-md-4">

                                    <label
                                        for="filmYear"
                                        class="form-label"
                                    >
                                        Anno
                                    </label>

                                    <input
                                        type="number"
                                        id="filmYear"
                                        class="form-control"
                                        placeholder="1999"
                                        min="1888"
                                        max="2100"
                                        required
                                    >

                                </div>


                                <div class="col-md-6">

                                    <label
                                        for="filmGenre"
                                        class="form-label"
                                    >
                                        Genere principale
                                    </label>

                                    <input
                                        type="text"
                                        id="filmGenre"
                                        class="form-control"
                                        placeholder="Es. Thriller"
                                        required
                                    >

                                </div>


                                <div class="col-md-6">

                                    <label
                                        for="filmGenres"
                                        class="form-label"
                                    >
                                        Generi
                                    </label>

                                    <input
                                        type="text"
                                        id="filmGenres"
                                        class="form-control"
                                        placeholder="Es. Thriller, Mistero, Drammatico"
                                    >

                                </div>


                                <div class="col-md-4">

                                    <label
                                        for="filmRating"
                                        class="form-label"
                                    >
                                        Voto
                                    </label>

                                    <input
                                        type="number"
                                        id="filmRating"
                                        class="form-control"
                                        placeholder="8.5"
                                        min="0"
                                        max="10"
                                        step="0.1"
                                        required
                                    >

                                </div>


                                <div class="col-md-4">

                                    <label
                                        for="filmDuration"
                                        class="form-label"
                                    >
                                        Durata
                                    </label>

                                    <input
                                        type="text"
                                        id="filmDuration"
                                        class="form-control"
                                        placeholder="Es. 1h 47min"
                                    >

                                </div>


                                <div class="col-md-4">

                                    <label
                                        for="filmDirector"
                                        class="form-label"
                                    >
                                        Regista
                                    </label>

                                    <input
                                        type="text"
                                        id="filmDirector"
                                        class="form-control"
                                        placeholder="Es. M. Night Shyamalan"
                                    >

                                </div>


                                <div class="col-12">

                                    <label
                                        for="filmImage"
                                        class="form-label"
                                    >
                                        URL immagine
                                    </label>

                                    <input
                                        type="url"
                                        id="filmImage"
                                        class="form-control"
                                        placeholder="https://..."
                                    >

                                </div>


                                <div class="col-12">

                                    <label
                                        for="filmDescription"
                                        class="form-label"
                                    >
                                        Descrizione
                                    </label>

                                    <textarea
                                        id="filmDescription"
                                        class="form-control"
                                        rows="4"
                                        placeholder="Descrizione del film..."
                                    ></textarea>

                                </div>


                                <div class="col-12">

                                    <div
                                        id="addFilmMessage"
                                        class="auth-message"
                                    ></div>

                                </div>


                                <div class="col-12">

                                    <div class="d-flex gap-2">

                                        <button
                                            type="submit"
                                            class="btn btn-light"
                                        >

                                            <i class="bi bi-plus-lg"></i>
                                            Salva film

                                        </button>


                                        <button
                                            type="button"
                                            class="btn btn-outline-light"
                                            id="cancelFilmButton"
                                        >

                                            Annulla

                                        </button>

                                    </div>

                                </div>

                            </div>

                        </form>

                    </div>


                    <div class="table-responsive">

                        <table class="table admin-table">

                            <thead>

                                <tr>

                                    <th>
                                        Titolo
                                    </th>

                                    <th>
                                        Anno
                                    </th>

                                    <th>
                                        Genere
                                    </th>

                                    <th>
                                        Voto
                                    </th>

                                    <th>
                                        Azioni
                                    </th>

                                </tr>

                            </thead>


                            <tbody id="filmsTable">

                                <tr>

                                    <td
                                        colspan="5"
                                        class="text-center"
                                    >
                                        Caricamento...
                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </main>


        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        <script src="../js/supabase.js"></script>

        <script src="../js/admin.js"></script>

    </body>

</html>
