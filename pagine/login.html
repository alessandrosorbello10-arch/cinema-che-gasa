<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi - Cinema che Gasa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="../index.html">Cinema che Gasa</a>
        </div>
    </nav>

    <main class="auth-page">
        <div class="auth-card">
            <span class="section-label">CINEMA CHE GASA</span>
            <h1>Accedi</h1>
            <p>Accedi al tuo account per entrare nel tuo spazio personale.</p>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="loginEmail" class="form-label">Email</label>
                    <input type="email" id="loginEmail" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="loginPassword" class="form-label">Password</label>
                    <input type="password" id="loginPassword" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-light w-100">
                    <i class="bi bi-box-arrow-in-right"></i> Accedi
                </button>

                <div id="loginMessage" class="auth-message"></div>
            </form>

            <p class="auth-switch">
                Non hai ancora un account?
                <a href="registrazione.html">Registrati</a>
            </p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
