<!DOCTYPE html>
<html lang="it">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<title>Accedi - Cinema che Gasa</title>

		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
		<link rel="stylesheet" href="../css/style.css">
		<link rel="icon" type="image/png" href="../img/logo_cinema-che-gasa.png">

		<style>
			.password-wrapper {
				position: relative;
			}

			.password-wrapper .form-control {
				padding-right: 48px;
			}

			.password-toggle {
				position: absolute;
				top: 50%;
				right: 12px;
				transform: translateY(-50%);
				padding: 5px;
				border: none;
				background: transparent;
				color: #777;
				cursor: pointer;
				z-index: 5;
			}

			.password-toggle:hover {
				color: #dc3545;
			}

			.password-toggle:focus-visible {
				outline: 2px solid #dc3545;
				border-radius: 4px;
			}

			#loginButton:disabled,
			#forgotPasswordButton:disabled {
				opacity: 0.7;
				cursor: wait;
			}

			.auth-message:empty {
				display: none;
			}

			.forgot-password {
				text-align: right;
				margin-top: 8px;
			}

			.forgot-password button {
				color: #dc3545;
				text-decoration: none;
				font-size: 0.9rem;
			}

			.forgot-password button:hover {
				color: #ff6677;
				text-decoration: underline;
			}
		</style>
	</head>

	<body>
		<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
			<div class="container-fluid px-4">
				<a class="navbar-brand d-flex align-items-center" href="../index.html">
					<img
						src="../img/logo_cinema-che-gasa.png"
						alt="Cinema che Gasa"
						class="site-logo"
					>

					<span>
						<strong>
							<span style="color: red; font-size: larger;">Cinema</span>
							che Gasa
						</strong>
					</span>
				</a>
			</div>
		</nav>

		<main class="auth-page">
			<div class="auth-card">
				<span class="section-label">CINEMA CHE GASA</span>

				<h1>Accedi</h1>

				<p>
					Accedi al tuo account per entrare nel tuo spazio personale.
				</p>

				<form id="loginForm">
					<div class="mb-3">
						<label for="loginEmail" class="form-label">
							Email
						</label>

						<input
							type="email"
							id="loginEmail"
							class="form-control"
							autocomplete="username"
							required
						>
					</div>

					<div class="mb-3">
						<label for="loginPassword" class="form-label">
							Password
						</label>

						<div class="password-wrapper">
							<input
								type="password"
								id="loginPassword"
								class="form-control"
								autocomplete="current-password"
								required
							>

							<button
								type="button"
								class="password-toggle"
								id="togglePassword"
								aria-label="Mostra password"
								aria-pressed="false"
							>
								<i
									class="bi bi-eye"
									id="togglePasswordIcon"
									aria-hidden="true"
								></i>
							</button>
						</div>

						<div class="forgot-password">
							<button
								type="button"
								id="forgotPasswordButton"
								class="btn btn-link p-0"
							>
								Password dimenticata?
							</button>
						</div>
					</div>

					<button
						type="submit"
						class="btn btn-light w-100"
						id="loginButton"
					>
						<i class="bi bi-box-arrow-in-right"></i>
						Accedi
					</button>

					<div
						id="loginMessage"
						class="auth-message mt-3"
						role="status"
						aria-live="polite"
					></div>
				</form>

				<p class="auth-switch">
					Non hai ancora un account?
					<a href="registrazione.html">Registrati</a>
				</p>
			</div>
		</main>

		<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
		<script src="../js/supabase.js"></script>
		<script src="../js/login.js"></script>
		<script src="../js/cookie-consent.js"></script>

		<script>
			const passwordInput = document.getElementById("loginPassword");
			const togglePassword = document.getElementById("togglePassword");
			const togglePasswordIcon = document.getElementById("togglePasswordIcon");

			togglePassword.addEventListener("click", () => {
				const showPassword = passwordInput.type === "password";

				passwordInput.type = showPassword ? "text" : "password";

				togglePasswordIcon.className = showPassword
					? "bi bi-eye-slash"
					: "bi bi-eye";

				togglePassword.setAttribute(
					"aria-label",
					showPassword ? "Nascondi password" : "Mostra password"
				);

				togglePassword.setAttribute(
					"aria-pressed",
					String(showPassword)
				);
			});
		</script>
	</body>
</html>
