<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione - Cinema che Gasa</title>
    <meta name="description" content="Crea il tuo account su Cinema che Gasa.">
    <link rel="icon" href="../img/logo_cinema-che-gasa.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .auth-container {
            max-width: 460px;
            margin: 60px auto;
            padding: 30px;
            background: #171717;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .auth-container h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-container label {
            color: #fff;
        }

        .auth-container .form-control {
            background: #252525;
            color: #fff;
            border: 1px solid #444;
        }

        .auth-container .form-control:focus {
            background: #252525;
            color: #fff;
            border-color: #dc3545;
            box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.2);
        }

        .auth-container .form-control::placeholder {
            color: #aaa;
        }

        .terms-box {
            margin-top: 20px;
        }

        .terms-box .form-check {
            margin-bottom: 12px;
        }

        .terms-box a {
            color: #ff4d5a;
        }

        .auth-message {
            margin-top: 15px;
            text-align: center;
        }

        #captchaCanvas {
            display: block;
            max-width: 100%;
            height: auto;
            border: 1px solid #444;
            border-radius: 5px;
        }

        #captchaRefresh {
            min-width: 44px;
            min-height: 44px;
            font-size: 22px;
        }

        .captcha-help {
            color: #bbb;
            font-size: 0.85rem;
        }

        .auth-container button[type="submit"] {
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="auth-container">
            <div class="text-center mb-4">
                <a href="../index.html" class="text-decoration-none text-white">
                    <span>
                        <strong>
                            <span style="color: red; font-size: larger;">Cinema</span> che Gasa
                        </strong>
                    </span>
                </a>
            </div>

            <h1>Registrati</h1>

            <form id="registerForm">
                <div class="mb-3">
                    <label for="registerEmail" class="form-label">Email</label>
                    <input
                        type="email"
                        id="registerEmail"
                        class="form-control"
                        autocomplete="email"
                        required>
                </div>

                <div class="mb-3">
                    <label for="registerPassword" class="form-label">Password</label>
                    <input
                        type="password"
                        id="registerPassword"
                        class="form-control"
                        minlength="6"
                        autocomplete="new-password"
                        required>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Conferma password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        class="form-control"
                        minlength="6"
                        autocomplete="new-password"
                        required>
                </div>

                <div class="mb-4">
                    <label for="captchaInput" class="form-label">Verifica di sicurezza</label>

                    <div class="d-flex align-items-center gap-2 mb-2">
                        <canvas
                            id="captchaCanvas"
                            width="190"
                            height="55"
                            role="img"
                            aria-label="Codice CAPTCHA da leggere">
                        </canvas>

                        <button
                            type="button"
                            id="captchaRefresh"
                            class="btn btn-outline-light"
                            aria-label="Genera un nuovo codice"
                            title="Genera un nuovo codice">
                            ↻
                        </button>
                    </div>

                    <input
                        type="text"
                        id="captchaInput"
                        class="form-control"
                        placeholder="Inserisci il codice"
                        autocomplete="off"
                        autocapitalize="off"
                        spellcheck="false"
                        maxlength="6"
                        required>

                    <div id="captchaMessage" class="small mt-2" aria-live="polite"></div>

                    <div class="captcha-help mt-1">
                        Non riesci a leggere il codice? Premi ↻ per cambiarlo.
                    </div>
                </div>

                <div class="terms-box mb-3">
                    <div class="form-check">
                        <input
                            type="checkbox"
                            id="acceptTerms"
                            class="form-check-input"
                            required>

                        <label for="acceptTerms" class="form-check-label">
                            Accetto i
                            <a href="../termini.html" target="_blank" rel="noopener noreferrer">
                                Termini e condizioni
                            </a>.
                        </label>
                    </div>

                    <div class="form-check">
                        <input
                            type="checkbox"
                            id="acceptPrivacy"
                            class="form-check-input"
                            required>

                        <label for="acceptPrivacy" class="form-check-label">
                            Dichiaro di aver letto la
                            <a href="../privacy.html" target="_blank" rel="noopener noreferrer">
                                Privacy Policy
                            </a>.
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn btn-danger">
                    Registrati
                </button>

                <div id="registerMessage" class="auth-message" aria-live="polite"></div>
            </form>

            <p class="text-center mt-4 mb-0">
                Hai già un account?
                <a href="login.html" class="text-danger">Accedi</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/captcha.js"></script>
    <script src="../js/registrazione.js"></script>
    <script src="../js/cookie-consent.js"></script>
</body>
</html>
