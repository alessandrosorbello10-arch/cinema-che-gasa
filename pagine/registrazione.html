<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registrati - Cinema che Gasa</title>
        <link rel="icon" type="image/png" href="img/logo_cinema-che-gasa.png">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
            <div class="container-fluid px-4">
                <a class="navbar-brand fw-bold" href="../index.html">Cinema che Gasa</a>
            </div>
        </nav>

        <main class="auth-page">
            <div class="auth-card">
                <span class="section-label">CINEMA CHE GASA</span>
                <h1>Crea il tuo account</h1>
                <p>Registrati per entrare nel tuo spazio personale.</p>

                <form id="registerForm">
                    <div class="mb-3">
                        <label for="registerEmail" class="form-label">Email</label>
                        <input type="email" id="registerEmail" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="registerPassword" class="form-label">Password</label>
                        <input type="password" id="registerPassword" class="form-control" minlength="6" required>
                    </div>

                    <button type="submit" class="btn btn-light w-100">
                        <i class="bi bi-person-plus"></i> Registrati
                    </button>

                    <div id="registerMessage" class="auth-message"></div>
                </form>

                <p class="auth-switch">
                    Hai già un account?
                    <a href="login.html">Accedi</a>
                </p>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../js/supabase.js"></script>
        <script src="../js/registrazione.js"></script>
    </body>
</html>
