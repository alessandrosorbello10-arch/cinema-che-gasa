<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Film - Cinema che Gasa</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
            <div class="container-fluid px-4">
                <a class="navbar-brand fw-bold" href="../index.html">Cinema che Gasa</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Apri menu"><span class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse" id="mainNavbar">
                    <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="../index.html"><i class="bi bi-house-door"></i> Home</a></li>
                        <li class="nav-item"><a class="nav-link active" href="film.html"><i class="bi bi-film"></i> Film</a></li>
                        <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-grid"></i> Generi</a></li>
                        <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-trophy"></i> Classifiche</a></li>
                    </ul>
                    <div class="d-flex gap-2">
                        <a href="#" class="btn btn-outline-light"><i class="bi bi-box-arrow-in-right"></i> Accedi</a>
                        <a href="#" class="btn btn-light">Registrati</a>
                    </div>
                </div>
            </div>
        </nav>

        <main class="film-detail">
            <div class="film-detail-backdrop"></div>
            <div class="film-detail-overlay"></div>

            <div class="container film-detail-content">
                <a href="film.html" class="back-button"><i class="bi bi-arrow-left"></i> Torna ai film</a>

                <div class="row align-items-center g-5">
                    <div class="col-md-4 col-lg-3">
                        <img id="filmPoster" class="film-detail-poster" src="" alt="">
                    </div>

                    <div class="col-md-8 col-lg-8">
                        <span class="section-label">FILM</span>
                        <h1 id="filmTitle">Caricamento...</h1>
                        <div id="filmInfo" class="film-detail-info"></div>

                        <div class="film-detail-meta">
                            <span><i class="bi bi-calendar3"></i> <strong id="filmYear">-</strong></span>
                            <span><i class="bi bi-clock"></i> <strong id="filmDuration">-</strong></span>
                        </div>

                        <p id="filmDescription" class="film-detail-description"></p>

                        <div class="film-rating">
                            <i class="bi bi-star-fill"></i>
                            <strong id="filmRating">-</strong>
                            <span>/10</span>
                        </div>

                        <div class="film-detail-extra">
                            <div>
                                <span>Regista</span>
                                <strong id="filmDirector">-</strong>
                            </div>
                            <div>
                                <span>Generi</span>
                                <strong id="filmGenres">-</strong>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <div class="container text-center">
                <p>© <span id="currentYear"></span> Cinema che Gasa</p>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../js/supabase.js"></script>
        <script src="../js/film-dettaglio.js"></script>
    </body>
</html>
